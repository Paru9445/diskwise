name: Bug report
description: Something went wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Diskwise version and OS
      placeholder: diskwise 0.1.0 on macOS 15 / Windows 11 / Ubuntu 24.04
    validations:
      required: true
