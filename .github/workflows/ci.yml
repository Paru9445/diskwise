name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to exact commits: a tag like @v4 can be moved to new code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      # Test tools are pinned and hash-checked; Diskwise itself has no dependencies.
      - run: python -m pip install --require-hashes --only-binary=:all: -r tests/requirements.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m pytest -v
      - name: Smoke test the installed command
        run: |
          diskwise --version
          diskwise rules
          diskwise scan --no-projects --details
          diskwise measure .
