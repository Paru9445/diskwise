name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to exact commits: a tag like @v4 can be moved to new code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # Test tools are pinned and hash-checked; Diskwise itself has no dependencies.
      # Block style (|): ":all: " would otherwise be read as YAML.
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r tests/requirements.txt
          python -m pip install --no-deps --no-build-isolation .
      - run: python -m pytest -v
      - name: Smoke test the installed command
        run: |
          diskwise --version
          diskwise rules
          diskwise scan --no-projects --details
          diskwise measure .
