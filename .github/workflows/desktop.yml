name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job below can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest       # Apple silicon
          - windows-latest
          - ubuntu-22.04       # older glibc, so the build runs on more distros
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to exact commits: a tag like @v4 can be moved to new code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3
      # Every package is pinned to an exact version and checked against its hash.
      # setuptools goes first so the one source-only package (proxy-tools) builds with
      # it instead of an unchecked download. PyInstaller reads Diskwise from src/.
      # Block style (|): ":all: " would otherwise be read as YAML.
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-bootstrap.txt
          python -m pip install --require-hashes --prefer-binary --no-build-isolation -r packaging/requirements-build.txt
      - run: python packaging/build.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diskwise-${{ runner.os }}
          path: dist/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: sha256sum Diskwise-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Diskwise $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
