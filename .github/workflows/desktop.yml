name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the release job below can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest       # Apple silicon
          - windows-latest
          - ubuntu-22.04       # older glibc, so the build runs on more distros
    runs-on: ${{ matrix.os }}
    steps:
      # Actions are pinned to exact commits: a tag like @v4 can be moved to new code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3
      # Every package is pinned to an exact version and checked against its hash.
      # setuptools goes first so the one source-only package (proxy-tools) builds with
      # it instead of an unchecked download. PyInstaller reads Diskwise from src/.
      - run: python -m pip install --require-hashes --only-binary=:all: -r packaging/requirements-bootstrap.txt
      - run: python -m pip install --require-hashes --prefer-binary --no-build-isolation -r packaging/requirements-build.txt
      - run: python packaging/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diskwise-${{ runner.os }}
          path: dist/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Write checksums
        working-directory: release
        run: sha256sum Diskwise-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "Diskwise $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
